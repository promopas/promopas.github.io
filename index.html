
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>PAS PROMO APP</title>

  <!-- Favicon PAS: pastikan favicon.png tersedia di repository -->
  <link rel="icon" type="image/png" href="logopas.png">
  <link rel="apple-touch-icon" href="logopas.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    #app {
      display: block;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: 0;
      background: #fff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      color: #475569;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="loading">Membuka PAS PROMO APP...</div>

  <iframe
    id="app"
    title="PAS PROMO APP"
    hidden
    allow="clipboard-read; clipboard-write"
    allowfullscreen
  ></iframe>

  <script>
    (() => {
      "use strict";

      const APP_URL =
        "https://script.google.com/macros/s/AKfycbwTIq_UoOsx3Z6VFxO--iUcdqW0qU6FStptwa2sXTBxbJ_kZBXeA5Cb0MgID9gusU_8Hg/exec";

      const isMobile =
        /Android|iPhone|iPad|iPod|IEMobile|Opera Mini/i
          .test(navigator.userAgent);

      if (isMobile) {
        // HP: buka Apps Script langsung, bukan di dalam iframe.
        window.location.replace(APP_URL);
      } else {
        // PC: pertahankan tampilan di GitHub Pages.
        const frame = document.getElementById("app");
        frame.src = APP_URL;
        frame.hidden = false;
        document.getElementById("loading").remove();
      }
    })();
  </script>

</body>
</html>
